name: Static HTML source integrity

on:
  push:
    branches: [master]
    paths:
      - '**/*.html'
      - '**/*.htm'
      - 'scripts/check_static_html.py'
      - 'tests/test_static_site_integrity.py'
      - '.github/workflows/ci-cd-pipeline.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run offline integrity regression tests
        run: python3 -m unittest discover -s tests -p test_static_site_integrity.py -v
      - name: Audit tracked HTML sources
        run: python3 scripts/check_static_html.py .
      - name: Describe assurance boundary
        if: always()
        run: |
          echo "Source integrity only: presence, nonempty pages, UTF-8, NUL checks." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does not claim link validity, security, copyright ownership, live website availability, or deployment." >> "$GITHUB_STEP_SUMMARY"
